---
# Template only — install.sh fills this in from $OPENAI_API_KEY. DO NOT
# commit a real key. If you prefer another provider (Anthropic, Gemini,
# Bedrock, Ollama), see kagent docs for the matching key shape.
apiVersion: v1
kind: Secret
metadata:
  name: kagent-openai
  namespace: kagent-eval
type: Opaque
stringData:
  api-key: "REPLACE_WITH_OPENAI_API_KEY"
