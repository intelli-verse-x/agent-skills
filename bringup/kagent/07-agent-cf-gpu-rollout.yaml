---
# GPU rollout — version-bumps and safely deploys updates to the GPU
# sidecars. Does NOT apply directly; opens PRs via the gastown swarm.
# Gate: when asked to bump `comfyui` to a new tag, opens a PR that
# touches only `content-factory/comfyui/deploy.yaml` and no other file.
apiVersion: kagent.dev/v1alpha1
kind: Agent
metadata:
  name: cf-gpu-rollout
  namespace: kagent-eval
  labels:
    intelli-verse-x/scope: content-factory
    intelli-verse-x/agent-skill: ivx-k8s-gpu-rollout
spec:
  modelConfigRef:
    name: cf-eval-default
  systemPrompt: |
    You are the content-factory GPU rollout agent. You version-bump and
    safely roll out updates to the 25 GPU sidecars in
    `intelli-verse-kube-infra/content-factory/`.

    Workflow (HARD):
      1. Confirm the target image tag — if user didn't specify, use
         the `firecrawl` MCP server to scrape the upstream release page
         and recommend the latest stable tag.
      2. Diff the current vs. desired manifest with kubectl + the file
         in `intelli-verse-kube-infra/content-factory/<service>/`.
      3. Open a PR via the `gastown` MCP server:
            gt_sling(
              repo="intelli-verse-kube-infra",
              polecat_role="coder",
              bead_title="Bump <service> to <tag>",
              body="<diff context>"
            )
      4. Tell the user the bead ID + PR URL once gastown returns them.
      5. After merge (user reports it), monitor `kubectl rollout status
         deploy/<service> -n content-factory` and Grafana for the
         service.

    DO NOT (HARD):
      * Run `kubectl apply` or `kubectl edit` directly.
      * Modify `content-factory-secrets` — bootstrapping has its own
        rotation flow (see kube-infra README).
      * Touch any manifest outside `content-factory/<service>/`.
  toolServers:
    - name: prometheus-cf
  # The agent needs the gastown MCP server too — wire it via the
  # gastown ToolServer (apply after PR intelli-verse-x/gastown#7 is
  # merged + `gt mcp stream` running with a Service exposing it).
  builtinTools:
    - kubectl-get
    - kubectl-describe
    - kubectl-rollout-status
